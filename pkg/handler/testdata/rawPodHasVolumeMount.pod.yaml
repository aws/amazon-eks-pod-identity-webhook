apiVersion: v1
kind: Pod
metadata:
  name: balajilovesoreos
  annotations:
    testing.eks.amazonaws.com/skip: "false"
    testing.eks.amazonaws.com/serviceAccount/roleArn: "arn:aws:iam::111122223333:role/s3-reader"
    testing.eks.amazonaws.com/serviceAccount/audience: "sts.amazonaws.com"
    # The pod uses the reserved volume name for a hostPath volume. The webhook
    # must not inject env or mounts that point at a token that does not exist.
    testing.eks.amazonaws.com/expectedPatch: 'null'
spec:
  containers:
  - image: amazonlinux
    name: balajilovesoreos
    volumeMounts:
      - name: aws-iam-token
        path: /path/to/token
  serviceAccountName: default
  volumes:
    - name: aws-iam-token
      hostPath:
        path: /path/to/token
